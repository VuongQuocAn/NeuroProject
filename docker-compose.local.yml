# Standalone local stack: no NVIDIA runtime or pre-existing volumes required.
# Use -f explicitly so workstation-specific overrides are not loaded.
name: neuroproject-local

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-neuro_db}
  MINIO_URL: minio:9000
  MINIO_PUBLIC_URL: http://localhost:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-password123}
  MINIO_SECURE: "false"
  MINIO_REGION: us-east-1
  MINIO_BUCKET: medical-data
  R2_BUCKET: medical-data
  RNA_BUCKET: medical-data
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  LOCAL_DEMO_SEED: ${LOCAL_DEMO_SEED:-true}
  BACKEND_PUBLIC_URL: http://localhost:${LOCAL_BACKEND_PORT:-8001}

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuro_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: neuroproject-minio:local
    build:
      context: ./docker/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: neuroproject-minio:local
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password123}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/medical-data local/analysis-results
    depends_on:
      minio:
        condition: service_healthy

  backend:
    image: neuroproject-ai:local-cpu
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-environment
    ports:
      - "${LOCAL_BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - torch_cache:/root/.cache/torch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  worker:
    image: neuroproject-ai:local-cpu
    restart: unless-stopped
    command: celery -A celery_app.celery_app worker --loglevel=info --pool=threads --concurrency=1
    env_file:
      - .env
    environment: *backend-environment
    volumes:
      - ./backend:/app
      - torch_cache:/root/.cache/torch
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${LOCAL_BACKEND_PORT:-8001}
      NEXT_PUBLIC_USE_MOCK_DATA: "false"
      NODE_OPTIONS: --max-old-space-size=4096
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redis_data:
  minio_data:
  frontend_node_modules:
  torch_cache:
