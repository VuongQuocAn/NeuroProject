name: neuroproject-tunnel

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuroproject}
      POSTGRES_USER: ${POSTGRES_USER:-neuroproject}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neuro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-neuroproject} -d ${POSTGRES_DB:-neuroproject}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - neuro_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: neuroproject-ai:tunnel-cpu
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    restart: unless-stopped
    env_file:
      - .env.tunnel
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neuroproject}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroproject}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      PORT: ${PORT:-8000}
    volumes:
      - ./backend:/app
      - torch_cache:/root/.cache/torch
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - neuro_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12

  worker:
    image: neuroproject-ai:tunnel-cpu
    restart: unless-stopped
    env_file:
      - .env.tunnel
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neuroproject}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroproject}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
    command: celery -A celery_app.celery_app worker --loglevel=info --pool=threads --concurrency=1
    volumes:
      - ./backend:/app
      - torch_cache:/root/.cache/torch
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - neuro_net

networks:
  neuro_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  torch_cache:
